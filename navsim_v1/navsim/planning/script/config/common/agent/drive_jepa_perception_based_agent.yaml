_target_: navsim.agents.drive_jepa_perception_based.drive_jepa_agent.DriveJEPAAgent
_convert_: 'all'

config:
  _target_: navsim.agents.drive_jepa_perception_based.drive_jepa_config.DriveJEPAConfig
  _convert_: 'all'

  trajectory_sampling:
    _target_: nuplan.planning.simulation.trajectory.trajectory_sampling.TrajectorySampling
    _convert_: 'all'
    time_horizon: 4
    interval_length: 0.5

  latent: False

  # Disabled for the exact PB-G path. The dedicated post-trajectory runner
  # enables these fields explicitly.
  posttraj_future_enabled: false
  posttraj_future_loss_weight: 0.1
  posttraj_future_ema_decay: 0.99925
  posttraj_future_frame_offsets: [1]
  posttraj_future_candidate_layers: 2
  posttraj_future_full_decoder_layers: 2
  posttraj_full_candidate_latent: false
  posttraj_scorer_temporal_layers: 1
  posttraj_future_layernorm_target: true
  posttraj_detach_trajectory_inputs: true
  anchor_trajectory_path: ''
  posttraj_stage2_enabled: false
  posttraj_stage2_anchor_cache_root: ''
  posttraj_stage2_num_local_hard: 64
  posttraj_stage2_num_balanced: 64
  posttraj_stage2_nearest_per_proposal: 64
  posttraj_stage2_min_score_gap: 0.2
  posttraj_stage2_yaw_weight: 0.5
  posttraj_stage2_anchor_loss_weight: 0.5
  posttraj_stage2_seed: 20260815
  posttraj_stage2_use_anchors: true
  posttraj_stage2_sampling_profile: balanced
  posttraj_final_topk_rank_weight: 0.0
  posttraj_final_topk_rank_k: 8
  posttraj_final_topk_rank_score_gap: 0.01
  posttraj_final_topk_rank_margin_cap: 0.05
  posttraj_final_topk_rank_false_topk_weight: 2.0
  posttraj_final_topk_rank_safety_weight: 3.0
  posttraj_final_topk_rank_safety_threshold: 0.95
  posttraj_safety_hard_enabled: false
  posttraj_safety_rank_weight: 0.0
  posttraj_safety_threshold: 0.95
  posttraj_safety_rank_topk: 8
  posttraj_safety_rank_margin: 0.05
  posttraj_safety_unsafe_final_weight: 4.0
  posttraj_safe_final_rank_weight: 0.0
  posttraj_safe_final_rank_topk: 8
  posttraj_safe_final_rank_score_gap: 0.01
  posttraj_safe_final_rank_margin_cap: 0.05
  posttraj_stage2_schedule_enabled: false
  posttraj_stage2_unsafe_final_weight_schedule: []
  posttraj_stage2_safety_rank_weight_schedule: []
  posttraj_stage2_safe_final_rank_weight_schedule: []
  posttraj_stage2_lr_schedule: []
  posttraj_joint_enabled: false
  posttraj_joint_warmup_epochs: 5
  posttraj_joint_ramp_epochs: 5
  posttraj_joint_anchor_loss_weight: 0.25
  posttraj_joint_safety_schedule_enabled: false
  posttraj_joint_unsafe_final_weight_schedule: []
  posttraj_joint_safety_rank_weight_schedule: []
  posttraj_joint_safe_final_rank_weight_schedule: []

checkpoint_path: ''
lr: 1e-4
cache_data: false
